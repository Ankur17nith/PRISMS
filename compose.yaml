
services:
  postgres:
    image: postgres:18
    container_name: prisms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisms
      POSTGRES_USER: prisms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prisms_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisms_app -d prisms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prisms_postgres_data:
